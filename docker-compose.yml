name: flame-sport-pheno

services:
  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在顶层 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flame_sport_pheno}
      MYSQL_USER: ${MYSQL_USER:-flame}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在顶层 .env 中设置 MYSQL_PASSWORD}
    ports:
      # 初期部署允许宿主机和外部测试工具直连；生产环境应结合防火墙限制来源地址。
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - flame_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./flame-sport-pheno-be
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_MODE: ${APP_MODE:-production}
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-flame}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-flame_sport_pheno}?charset=utf8mb4
      DB_ECHO: ${DB_ECHO:-false}
      ACTIVE_SEASON_CONFIG_EDIT_WINDOW_HOURS: ${ACTIVE_SEASON_CONFIG_EDIT_WINDOW_HOURS:-24}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_AGENT_ID: ${DINGTALK_AGENT_ID:-}
      DINGTALK_HTTP_TIMEOUT_SECONDS: ${DINGTALK_HTTP_TIMEOUT_SECONDS:-5}
      DINGTALK_ACCESS_TOKEN_REFRESH_INTERVAL_SECONDS: ${DINGTALK_ACCESS_TOKEN_REFRESH_INTERVAL_SECONDS:-300}
      DINGTALK_ACCESS_TOKEN_REFRESH_SKEW_SECONDS: ${DINGTALK_ACCESS_TOKEN_REFRESH_SKEW_SECONDS:-300}
      DINGTALK_NOTIFICATION_CHECK_INTERVAL_SECONDS: ${DINGTALK_NOTIFICATION_CHECK_INTERVAL_SECONDS:-60}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_HTTP_TIMEOUT_SECONDS: ${DEEPSEEK_HTTP_TIMEOUT_SECONDS:-60}
      LLM_PRELIMINARY_REVIEW_ENABLED: ${LLM_PRELIMINARY_REVIEW_ENABLED:-false}
      LLM_PRELIMINARY_REVIEW_INTERVAL_SECONDS: ${LLM_PRELIMINARY_REVIEW_INTERVAL_SECONDS:-900}
      LLM_PRELIMINARY_REVIEW_MIN_AGE_SECONDS: ${LLM_PRELIMINARY_REVIEW_MIN_AGE_SECONDS:-300}
      LLM_PRELIMINARY_REVIEW_MIN_BATCH_SIZE: ${LLM_PRELIMINARY_REVIEW_MIN_BATCH_SIZE:-10}
      LLM_PRELIMINARY_REVIEW_CONCURRENCY: ${LLM_PRELIMINARY_REVIEW_CONCURRENCY:-3}
      PROGRESS_COMPLETION_SNAP_THRESHOLD: ${PROGRESS_COMPLETION_SNAP_THRESHOLD:-0.0001}
      AUTH_CACHE_TTL_SECONDS: ${AUTH_CACHE_TTL_SECONDS:-7200}
      AUTH_CACHE_CLEANUP_INTERVAL_SECONDS: ${AUTH_CACHE_CLEANUP_INTERVAL_SECONDS:-300}
      SEASON_PARTICIPATION_ALLOWED_DAYS: ${SEASON_PARTICIPATION_ALLOWED_DAYS:-7}
      LEADERBOARD_REFRESH_ENABLED: ${LEADERBOARD_REFRESH_ENABLED:-true}
      LEADERBOARD_REFRESH_ON_STARTUP: ${LEADERBOARD_REFRESH_ON_STARTUP:-true}
      LEADERBOARD_REFRESH_INTERVAL_SECONDS: ${LEADERBOARD_REFRESH_INTERVAL_SECONDS:-900}
      IMAGE_CACHE_MAX_AGE_SECONDS: ${IMAGE_CACHE_MAX_AGE_SECONDS:-1204800}
    ports:
      # 仅供宿主机 Nginx 访问；管理端容器通过 backend:8000 走 Compose 内网。
      - "127.0.0.1:${BACKEND_PORT:-18000}:8000"
    volumes:
      # 资源脱离 Git 工作区，频繁拉取或重新 clone 后端仓库不会影响运行期文件。
      - flame_backend_assets:/workspace/assets
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./flame-sport-pheno-fe
      dockerfile: Dockerfile
      args:
        VUE_APP_API_BASE_URL: ${VUE_APP_API_BASE_URL:-/flame/api}
        VUE_APP_SHOP_REDEEM_WINDOW_DAYS: ${VUE_APP_SHOP_REDEEM_WINDOW_DAYS:-7}
        VUE_APP_ACTIVE_SEASON_CONFIG_EDIT_WINDOW_HOURS: ${ACTIVE_SEASON_CONFIG_EDIT_WINDOW_HOURS:-24}
        VUE_APP_PAGE_TITLE: ${VUE_APP_PAGE_TITLE:-燃动现象}
        VUE_APP_DINGTALK_CORP_ID: ${VUE_APP_DINGTALK_CORP_ID:-}
        VUE_APP_DINGTALK_CLIENT_ID: ${VUE_APP_DINGTALK_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/flame/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  manage-backend:
    build:
      context: ./flame-sport-pheno-manage-be
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      APP_NAME: ${MANAGE_APP_NAME:-燃动现象管理端后端}
      APP_ENV: ${MANAGE_APP_ENV:-production}
      APP_DEBUG: ${MANAGE_APP_DEBUG:-false}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      API_PREFIX: /flame/admin/api
      PUBLIC_API_PREFIX: /flame/admin/api
      CORS_ORIGINS: ${MANAGE_CORS_ORIGINS:-[]}
      ADMIN_KEY: ${MANAGE_ADMIN_KEY:?请在顶层 .env 中设置 MANAGE_ADMIN_KEY}
      ADMIN_TOKEN_TTL_SECONDS: ${MANAGE_ADMIN_TOKEN_TTL_SECONDS:-28800}
      ADMIN_TOKEN_CACHE_MAX_SIZE: ${MANAGE_ADMIN_TOKEN_CACHE_MAX_SIZE:-1000}
      ACTIVE_SEASON_CONFIG_EDIT_WINDOW_HOURS: ${ACTIVE_SEASON_CONFIG_EDIT_WINDOW_HOURS:-24}
      SEASON_STATUS_CHECK_ENABLED: ${MANAGE_SEASON_STATUS_CHECK_ENABLED:-true}
      SEASON_STATUS_CHECK_INTERVAL_SECONDS: ${MANAGE_SEASON_STATUS_CHECK_INTERVAL_SECONDS:-60}
      SEASON_SETTLEMENT_REVIEW_BATCH_SIZE: ${MANAGE_SEASON_SETTLEMENT_REVIEW_BATCH_SIZE:-100}
      SEASON_SETTLEMENT_REVIEW_CONCURRENCY: ${MANAGE_SEASON_SETTLEMENT_REVIEW_CONCURRENCY:-5}
      SEASON_SETTLEMENT_USER_BATCH_SIZE: ${MANAGE_SEASON_SETTLEMENT_USER_BATCH_SIZE:-100}
      SEASON_SETTLEMENT_AUTO_COMPLETE_ENABLED: ${MANAGE_SEASON_SETTLEMENT_AUTO_COMPLETE_ENABLED:-true}
      SEASON_SETTLEMENT_AUTO_COMPLETE_AFTER_DAYS: ${MANAGE_SEASON_SETTLEMENT_AUTO_COMPLETE_AFTER_DAYS:-5}
      SEASON_SETTLEMENT_TWO_MONTH_STREAK_BONUS_POINTS: ${MANAGE_SEASON_SETTLEMENT_TWO_MONTH_STREAK_BONUS_POINTS:-50}
      SEASON_SETTLEMENT_THREE_MONTH_STREAK_BONUS_POINTS: ${MANAGE_SEASON_SETTLEMENT_THREE_MONTH_STREAK_BONUS_POINTS:-100}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-flame}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在顶层 .env 中设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flame_sport_pheno}
      MYSQL_CHARSET: ${MANAGE_MYSQL_CHARSET:-utf8mb4}
      MYSQL_ECHO: ${MANAGE_MYSQL_ECHO:-false}
      MYSQL_POOL_SIZE: ${MANAGE_MYSQL_POOL_SIZE:-5}
      MYSQL_MAX_OVERFLOW: ${MANAGE_MYSQL_MAX_OVERFLOW:-5}
      MYSQL_POOL_RECYCLE_SECONDS: ${MANAGE_MYSQL_POOL_RECYCLE_SECONDS:-1800}
      CLIENT_BACKEND_BASE_URL: ${MANAGE_CLIENT_BACKEND_BASE_URL:-http://backend:8000/flame/api/admin}
      CLIENT_BACKEND_TIMEOUT_SECONDS: ${MANAGE_CLIENT_BACKEND_TIMEOUT_SECONDS:-10}
      IMAGE_CACHE_SECONDS: ${MANAGE_IMAGE_CACHE_SECONDS:-1204800}
      DEEPSEEK_API_KEY: ${AGENT_QUERY_DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${AGENT_QUERY_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${AGENT_QUERY_DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_HTTP_TIMEOUT_SECONDS: ${AGENT_QUERY_DEEPSEEK_HTTP_TIMEOUT_SECONDS:-60}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://127.0.0.1:8000/v1}
      VLLM_MODEL: ${VLLM_MODEL:-deepseek-v4-flash}
      VLLM_HTTP_TIMEOUT_SECONDS: ${VLLM_HTTP_TIMEOUT_SECONDS:-60}
      AGENT_QUERY_MODEL_PROVIDER: ${AGENT_QUERY_MODEL_PROVIDER:-deepseek}
      AGENT_QUERY_TOOL_TAG_ENABLED: ${AGENT_QUERY_TOOL_TAG_ENABLED:-true}
      AGENT_QUERY_TOOL_TAG_TEMPLATE: ${AGENT_QUERY_TOOL_TAG_TEMPLATE:-deepseek-v4.txt}
      DEEPSEEK_QUERY_ALIGNMENT_MAX_TOKENS: ${DEEPSEEK_QUERY_ALIGNMENT_MAX_TOKENS:-1200}
      DEEPSEEK_QUERY_PLANNING_MAX_TOKENS: ${DEEPSEEK_QUERY_PLANNING_MAX_TOKENS:-3000}
      DEEPSEEK_QUERY_INSPECTION_MAX_TOKENS: ${DEEPSEEK_QUERY_INSPECTION_MAX_TOKENS:-800}
      DEEPSEEK_QUERY_SQL_MAX_TOKENS: ${DEEPSEEK_QUERY_SQL_MAX_TOKENS:-1200}
      DEEPSEEK_QUERY_TRANSLATION_MAX_TOKENS: ${DEEPSEEK_QUERY_TRANSLATION_MAX_TOKENS:-1000}
      DEEPSEEK_QUERY_AUDIT_MAX_TOKENS: ${DEEPSEEK_QUERY_AUDIT_MAX_TOKENS:-500}
      AGENT_QUERY_ALIGNMENT_MAX_GENERATIONS: ${AGENT_QUERY_ALIGNMENT_MAX_GENERATIONS:-10}
      AGENT_QUERY_PLANNING_MAX_GENERATIONS: ${AGENT_QUERY_PLANNING_MAX_GENERATIONS:-30}
      AGENT_QUERY_PLANNING_MAX_TOOL_CALLS: ${AGENT_QUERY_PLANNING_MAX_TOOL_CALLS:-60}
      AGENT_QUERY_SQL_MAX_GENERATIONS: ${AGENT_QUERY_SQL_MAX_GENERATIONS:-4}
      AGENT_QUERY_TRANSLATION_MAX_PARALLEL_FIELDS: ${AGENT_QUERY_TRANSLATION_MAX_PARALLEL_FIELDS:-4}
      AGENT_QUERY_MAX_ACTIVE_SESSIONS: ${AGENT_QUERY_MAX_ACTIVE_SESSIONS:-20}
      AGENT_QUERY_EVENT_HISTORY_SIZE: ${AGENT_QUERY_EVENT_HISTORY_SIZE:-200}
      AGENT_QUERY_SESSION_TTL_SECONDS: ${AGENT_QUERY_SESSION_TTL_SECONDS:-3600}
      AGENT_QUERY_SSE_HEARTBEAT_SECONDS: ${AGENT_QUERY_SSE_HEARTBEAT_SECONDS:-15}
      AGENT_QUERY_HISTORY_PATH: ${AGENT_QUERY_HISTORY_PATH:-/workspace/data/query-history/query-history.sqlite3}
      AGENT_QUERY_HISTORY_RETENTION_DAYS: ${AGENT_QUERY_HISTORY_RETENTION_DAYS:-30}
      AGENT_QUERY_HISTORY_CACHE_TTL_SECONDS: ${AGENT_QUERY_HISTORY_CACHE_TTL_SECONDS:-600}
      AGENT_QUERY_DIAGNOSTIC_LOG_ENABLED: ${AGENT_QUERY_DIAGNOSTIC_LOG_ENABLED:-false}
      AGENT_QUERY_DIAGNOSTIC_LOG_LEVEL: ${AGENT_QUERY_DIAGNOSTIC_LOG_LEVEL:-basic}
    ports:
      # 仅向宿主机回环地址开放；容器间请求使用 manage-backend:8000。
      - "127.0.0.1:${MANAGE_BACKEND_PORT:-18001}:8000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - flame_manage_data:/workspace/data
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/flame/admin/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  manage-frontend:
    build:
      context: ./flame-sport-pheno-manage-fe
      dockerfile: Dockerfile
      args:
        APP_ENV: production
        VITE_PRODUCTION_APP_BASE_PATH: ${MANAGE_APP_BASE_PATH:-/flame/admin/}
        VITE_PRODUCTION_API_BASE_PATH: ${MANAGE_API_BASE_PATH:-/flame/admin/api}
    restart: unless-stopped
    ports:
      # 生产域名的宿主机 Nginx 应将 /flame/admin/ 转发到此回环端口。
      - "127.0.0.1:${MANAGE_FRONTEND_PORT:-18081}:80"
    depends_on:
      manage-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/flame/admin/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  flame_mysql_data:
  flame_backend_assets:
  flame_manage_data:
